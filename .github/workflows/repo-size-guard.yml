name: repo-size-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  large-files:
    name: GitHub 100 MiB guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check large blobs in history
        run: ./scripts/check-large-files.sh
